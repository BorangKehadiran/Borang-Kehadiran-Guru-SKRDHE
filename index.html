<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Borang Guru - Google Sheet</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #4e54c8, #8f94fb);
    color: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  form {
    background: #fff;
    padding: 25px 30px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    width: 90%;
    max-width: 400px;
    animation: fadeIn 0.8s ease;
  }
  input {
    width: 100%;
    padding: 10px;
    margin: 8px 0 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
  }
  button {
    width: 100%;
    background: #4e54c8;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
  }
  button:hover { background: #5f64e3; }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<form id="guruForm">
  <h2>Borang Kehadiran Guru</h2>
  <label>Nama Guru:</label>
  <input type="text" id="namaGuru" required>

  <label>ID DELIMa:</label>
  <input type="text" id="idDelima" required>

  <label>Kod Hari Ini:</label>
  <input type="text" id="kodHari" required>

  <button type="submit">Hantar</button>
  <p id="status" style="text-align:center;margin-top:10px;"></p>
</form>

<script>
document.getElementById("guruForm").addEventListener("submit", function(e){
  e.preventDefault();

  const data = {
    namaGuru: document.getElementById("namaGuru").value,
    idDelima: document.getElementById("idDelima").value,
    kodHari: document.getElementById("kodHari").value
  };

  fetch("https://script.google.com/macros/s/AKfycbyuHtJ32A_WUVqAzpu_Nb5sIftNHoglvGXggaZH2ug9hivMFUe0voU1VIVNjJvS_yPboQ/exec", {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  }).then(() => {
    document.getElementById("status").innerText = "✅ Data berjaya dihantar!";
    document.getElementById("guruForm").reset();
  }).catch(() => {
    document.getElementById("status").innerText = "❌ Ralat berlaku!";
  });
});
</script>

</body>
</html>
